<!DOCTYPE html>
<!--
============================================================================
イロナダレ / Tumblume  ―  引き継ぎメモ（このコメントを読めば再開できます）
============================================================================
■ 何か
  同色の塊を消す「さめがめ」系の一発勝負パズル。ルールの深さより「崩落＋
  演出のカタルシス」で気持ちよくする方針。単一HTML・外部依存なし・Canvas2D。
  全JSは末尾のscriptタグ内の1つのIIFE。タイトルは商標回避の造語（日本語=イロナダレ
  /英語=Tumblume）。

■ 遊び方 / ゲーム進行
  ・盤面10×12。同色が2つ以上つながった塊をタップで消去→重力落下→空列は左詰め。
  ・一発勝負：全消し(パーフェクト) か 手詰まり(=残りを自動一掃) で終了。
    リプレイボタンは無し（もう一度遊ぶ=ページ再読込）。
  ・得点 = 素点(連結数-1)^2 × 段位/コンボ由来の各種「加算」の合計。

■ FEVER段位（moves=消した回数で昇格：3手目→以降4手ごと）
  level = moves<3?0 : 1+floor((moves-3)/4)
  Lv1(3手)COMBO / Lv2(7)FEVER / Lv3(11)DOUBLE FEVER / Lv4(15)TRIPLE FEVER /
  Lv5(19)MIRACLE FEVER / Lv6(23)GALAXY FEVER / Lv7(27)COSMIC FEVER / 以降は+2,+3…
  昇格時：中央放射リング＋全画面フラッシュ＋スロー＋専用ファンファーレ＋2行バナー
  （文字は段位で拡大）。演出強度 heat=min(2,0.35+(lv-1)^1.4*0.28)。

■ 加算カテゴリ（BONUSES：解禁段位で増える。係数の増分は二次的=派手）
  Lv1 コンボ加算(×0.5) / Lv2 フィーバー加算(0.6) / Lv3 チェイン加算(1.0) /
  Lv4 ラッシュ加算(1.9) / Lv5 ミラクル加算(3.5) / Lv6 ギャラクシー加算(6.0) /
  Lv7 コズミック加算(9.6)。増分=0.1,0.4,0.9,1.6,2.5,3.6。＋連続加算(コンボ継続)。
  合計倍率の目安：×1.5→2.6→4.7→8.7→16.2→29.7→52.8。
  加算表示は小さめ・重なり・左右交互の微ドリフトで“気持ちいいパーティクル”扱い
  （読ませる文字ではない）。

■ 段位ごとの見た目/音
  ・スポットライト：feverActive(level>=1)で点灯。level<4は中心固定、
    level>=4(TRIPLE)から複数光源が旋回(emitters=min(4,level-2))。
  ・背景：level>=6(GALAXY)で宇宙へ(星/星雲/惑星/流星、突入時ワープ)。
    level>=7(COSMIC)で別宇宙(星雲変色/銀河回転/中心発光/再ワープ)。
  ・BGM：procedural(Web Audio)。musicStage=moves<3?0:min(7,level)で楽器増加：
    0キックのみ→1+ベース→2+ハット→3+パッド→4+アルペジオ→5+リード→6+高音→7+クラップ。
    テンポ 96+min(7,stage)*7 bpm。
  ・ブロックは heat連動で フラット→立体(グラデ+ハイライト)。粒子は3手目から。

■ クリア後（段位とは別）
  宇宙→地球へ帰還：白フラッシュ＋「ただいま、地球！」→ 青空(全消し時のみ夜空)に
  地面から花火が打ち上がる(円形/しだれ柳/二段咲き/スターマイン連発)。掛け声巡回。

■ 実装の要所（関数名）
  resize(幅720cap＋高さで盤面フィット) / tapCell / registerClear(段位) /
  levelUp / killBlock / collapse / checkEnd・startClearout・finishCelebrate・
  celebrateStart / firework・spawnShell / drawSpace・drawSky・drawFever / render /
  update(simNow=スロー対応の内部時計, hitstopReal, timeScale) / musicStep・musicScheduler。
  配慮：prefers-reduced-motionで回転/ストロボ/ワープ抑制。音ON/OFFトグルでBGMごとミュート。

■ 今後の候補（未着手アイデア）
  ワープをより長く映画的に / COSMICで銀河の渦(スパイラルアーム) / 惑星に環・衛星 /
  クリア時スコアのカウントアップ / ハイスコア保存 / 目標付き(例:15手全消し) 等。
============================================================================
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>イロナダレ｜Tumblume FEVER</title>
<style>
  :root{ --bg0:#120a1e; --ink:#efe7ff; --ink-dim:#9d84c4; --accent:#ff5d8f; --fever:#ffcf3b; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{ background:radial-gradient(120% 90% at 50% -10%, #2a1642 0%, var(--bg0) 60%, #08040f 100%);
    color:var(--ink); font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100dvh; padding:10px; gap:8px; overflow:hidden; }
  .wrap{ width:100%; max-width:720px; display:flex; flex-direction:column; gap:8px; }
  header{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 2px; }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand h1{ font-size:clamp(17px,4.6vw,22px); letter-spacing:.18em; font-weight:800;
    background:linear-gradient(180deg,#fff,#c9a8ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .brand span{ font-size:10px; letter-spacing:.16em; color:var(--ink-dim); }
  .score{ display:flex; align-items:baseline; gap:6px; line-height:1; }
  .score .label{ font-size:9px; letter-spacing:.2em; color:var(--ink-dim); }
  .score .val{ font-size:clamp(18px,5vw,26px); font-weight:800; font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff,#ffd7a0); -webkit-background-clip:text; background-clip:text; color:transparent; }

  .fever{ display:flex; align-items:center; gap:8px; padding:0 2px; }
  .fever .track{ position:relative; flex:1; height:10px; border-radius:999px; overflow:hidden;
    background:rgba(255,255,255,.07); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); }
  .fever .fill{ position:absolute; inset:0; width:0%; border-radius:999px;
    background:linear-gradient(90deg,#5ad6ff,#b57bff 45%,#ff5d8f 72%,#ffcf3b);
    transition:width .18s ease; box-shadow:0 0 12px rgba(255,120,180,.5); }
  .fever .tag{ font-size:10px; font-weight:800; letter-spacing:.1em; color:var(--ink-dim); min-width:84px; }
  .fever .tag.on{ color:var(--fever); text-shadow:0 0 14px rgba(255,207,59,.85); animation:feverPulse .6s ease-in-out infinite; }
  .fever .mult{ font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; color:#ffd7a0; min-width:44px; text-align:right; }
  @keyframes feverPulse{ 0%,100%{opacity:1} 50%{opacity:.5} }

  .board-frame{ position:relative; border-radius:16px; padding:8px;
    background:linear-gradient(160deg,#2a163f,#150b23);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 24px 60px -20px rgba(0,0,0,.85), 0 0 0 1px #3a2154, 0 0 var(--glowR,0px) rgba(255,120,190,var(--glowA,0));
    transition:box-shadow .25s ease; }
  canvas{ display:block; width:100%; border-radius:12px; background:#0b0616; touch-action:manipulation; }

  footer{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 2px; }
  .hint{ font-size:10px; color:var(--ink-dim); }
  .controls{ display:flex; gap:8px; }
  button{ font:inherit; font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--ink);
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:999px;
    padding:7px 14px; cursor:pointer; transition:transform .08s ease, background .2s, border-color .2s; }
  button:hover{ background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.28); }
  button:active{ transform:translateY(1px) scale(.97); }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  button[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#1a0a14; }

  .overlay{ position:absolute; inset:8px; border-radius:12px; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:6px; text-align:center; z-index:5;
    background:radial-gradient(62% 58% at 50% 46%, rgba(10,5,18,.86), rgba(10,5,18,.35) 82%, rgba(10,5,18,0)); }
  .overlay.show{ display:flex; }
  .overlay h2{ font-size:clamp(24px,8vw,40px); font-weight:800; letter-spacing:.08em;
    background:linear-gradient(180deg,#fff,#ffd7a0); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 30px rgba(255,180,90,.4); }
  .overlay .cheer{ font-size:clamp(16px,4.6vw,22px); font-weight:800; color:var(--fever); letter-spacing:.04em;
    text-shadow:0 0 16px rgba(255,207,59,.6); min-height:1.4em; }
  .overlay p.msg{ color:var(--ink-dim); font-size:12px; margin-top:4px; }
  .overlay .big{ font-size:clamp(30px,10vw,48px); font-weight:800; font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff,#ffd7a0); -webkit-background-clip:text; background-clip:text; color:transparent; }
  @keyframes cheerPop{ 0%{transform:scale(.7);opacity:0} 55%{transform:scale(1.12);opacity:1} 100%{transform:scale(1);opacity:1} }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><h1>イロナダレ</h1><span>TUMBLUME · FEVER</span></div>
      <div class="score"><span class="label">SCORE</span><span class="val" id="score">0</span></div>
    </header>

    <div class="fever">
      <div class="tag" id="feverTag">WARM UP</div>
      <div class="track"><div class="fill" id="feverFill"></div></div>
      <div class="mult" id="mult">×1.0</div>
    </div>

    <div class="board-frame" id="frame">
      <canvas id="c"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">全消し！</h2>
        <div class="big" id="ovScore">0</div>
        <p class="cheer" id="ovCheer"></p>
        <p class="msg" id="ovMsg">タップして次の盤面へ</p>
      </div>
    </div>

    <footer>
      <div class="hint">同じ色が2つ以上つながった塊をタップ</div>
      <div class="controls">
        <button id="soundBtn" aria-pressed="true">音 ON</button>
      </div>
    </footer>
  </div>

<script>
(() => {
  "use strict";

  const COLS=10, ROWS=12, TOTAL=COLS*ROWS;
  const PALETTE=[
    { base:"#ff4d6d", top:"#ff9bb0", spark:"#ffd8e0" },
    { base:"#ffab2e", top:"#ffcd82", spark:"#ffe9c4" },
    { base:"#37d99a", top:"#8ff0c8", spark:"#d6fff0" },
    { base:"#37aaff", top:"#93d5ff", spark:"#d6f0ff" },
    { base:"#b06bff", top:"#d4b0ff", spark:"#efe2ff" },
  ];
  const CHEERS=["よく頑張ったね！","ありがとう！","これで世界は救われた！"];
  // フィーバー段位（消した回数で昇格：3回で1段、その後4回ごと）
  const FEVER_NAMES=["COMBO","FEVER","DOUBLE FEVER","TRIPLE FEVER","MIRACLE FEVER","GALAXY FEVER","COSMIC FEVER"];
  const LEVEL_COLORS=["#ffcf3b","#ff5da8","#5ad6ff","#b06bff","#7dff9e","#ffffff"];
  const SPOT_COLORS=["#ff5da8","#ffcf3b","#5ad6ff","#b06bff","#7dff9e"];
  const NEB_G=[["#b06bff",0.16],["#ff5da8",0.13],["#5ad6ff",0.11]];
  const NEB_C=[["#ffcf3b",0.15],["#3bffd6",0.13],["#ff5da8",0.12]];
  const PROG=[ {root:45,tri:[57,60,64]}, {root:41,tri:[53,57,60]}, {root:48,tri:[60,64,67]}, {root:43,tri:[55,59,62]} ];
  // FEVER段位ごとに解禁される加算カテゴリ（上位ほど本数も係数も増えてインフレ）
  const BONUSES=[
    {lv:1,label:"コンボ加算",      color:"#ffcf3b",glow:"rgba(255,207,59,.9)",  coef:l=>l*0.5},
    {lv:2,label:"フィーバー加算",  color:"#ff9bc0",glow:"rgba(255,90,150,.9)",  coef:l=>(l-1)*0.6},
    {lv:3,label:"チェイン加算",    color:"#5ad6ff",glow:"rgba(90,214,255,.9)",  coef:l=>(l-2)*1.0},
    {lv:4,label:"ラッシュ加算",    color:"#ff8a3b",glow:"rgba(255,125,59,.9)",  coef:l=>(l-3)*1.9},
    {lv:5,label:"ミラクル加算",    color:"#b06bff",glow:"rgba(176,107,255,.9)", coef:l=>(l-4)*3.5},
    {lv:6,label:"ギャラクシー加算", color:"#7dff9e",glow:"rgba(125,255,158,.9)", coef:l=>(l-5)*6.0},
    {lv:7,label:"コズミック加算",  color:"#ffffff",glow:"rgba(255,255,255,.95)",coef:l=>(l-6)*9.6},
  ];

  const canvas=document.getElementById("c"), ctx=canvas.getContext("2d");
  let DPR=1, cell=40, W=0, H=0;
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
  function mix(h1,h2,t){ const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16),
    r=Math.round((a>>16&255)*(1-t)+(b>>16&255)*t), g=Math.round((a>>8&255)*(1-t)+(b>>8&255)*t), bl=Math.round((a&255)*(1-t)+(b&255)*t); return `rgb(${r},${g},${bl})`; }
  function makeGlow(hex){ const s=128,o=document.createElement("canvas");o.width=o.height=s;
    const g=o.getContext("2d"),grd=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    grd.addColorStop(0,hexA(hex,1));grd.addColorStop(.28,hexA(hex,.65));grd.addColorStop(1,hexA(hex,0));
    g.fillStyle=grd;g.fillRect(0,0,s,s);return o; }
  const glowWhite=makeGlow("#ffffff");
  const glowBase=PALETTE.map(p=>makeGlow(p.base));
  const glowSpark=PALETTE.map(p=>makeGlow(p.spark));
  PALETTE.forEach(p=>{ p.dark=mix(p.base,"#000000",0.5); });
  const glowCache={}; function glowRef(hex){ if(!glowCache[hex])glowCache[hex]=makeGlow(hex); return glowCache[hex]; }

  function resize(){
    const availW=Math.min(720,window.innerWidth-20)-16;
    const cellW=Math.floor(availW/COLS);
    const chromeH=20+24+16+12+headerEl.offsetHeight+feverEl.offsetHeight+footerEl.offsetHeight;
    const cellH=Math.floor((window.innerHeight-chromeH)/ROWS);
    cell=Math.max(14,Math.min(cellW,cellH));
    W=cell*COLS; H=cell*ROWS;
    DPR=Math.min(window.devicePixelRatio||1,2.5);
    canvas.style.width=W+"px";canvas.style.height=H+"px";
    canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    wrapEl.style.maxWidth=(W+16)+"px";
  }

  // ---- state ----
  let grid, dying=[], particles=[], rings=[], popups=[], bgFlashes=[];
  let score=0, phase="idle";
  let hitstopReal=0, simNow=0, timeScale=1, slowmoUntil=0;
  let shake=0, rot=0, zoom=1, bloom=0, flashOverlay=0, flashColor="#ffffff";
  let moves=0, level=0, heat=0;          // heat = 段位から導く演出強度(0→加速度的に上昇)
  let combo=0, comboTimer=0;
  let celebrating=false, feverActive=false, fwTimer=0, cheerTimer=0, cheerIdx=0, clearoutEnd=0, pendingLeft=0;
  let soundOn=true, waveEndAt=0, t=0;
  let musicStarted=false, nextNoteTime=0, step16=0, musicGain=null, noiseBuf=null, musicTimer=null;
  let stars=null, spaceAmt=0, cosmicAmt=0, warp=0, meteors=[];
  let clouds=null, shells=[], skyAmt=0, skyNight=false, volleyLeft=0, volleyTimer=0;

  const scoreEl=document.getElementById("score"), feverFill=document.getElementById("feverFill"),
    feverTag=document.getElementById("feverTag"), multEl=document.getElementById("mult"), frame=document.getElementById("frame"),
    overlay=document.getElementById("overlay"), ovTitle=document.getElementById("ovTitle"),
    ovScore=document.getElementById("ovScore"), ovCheer=document.getElementById("ovCheer"), ovMsg=document.getElementById("ovMsg");
  const headerEl=document.querySelector("header"), feverEl=document.querySelector(".fever"), footerEl=document.querySelector("footer"), wrapEl=document.querySelector(".wrap");

  const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v;
  function multiplier(){ let m=1; for(const b of BONUSES) if(level>=b.lv) m+=b.coef(level); return m + Math.max(0,combo-1)*0.3; }
  const heatFor=lv=> lv<=0?0:Math.min(2.0,0.35+Math.pow(lv-1,1.4)*0.28);
  function feverProgress(){ if(moves<3) return moves/3; return ((moves-3)%4)/4; }

  function newBlock(c,r,color){ return {c,r,color,x:c*cell,y:r*cell,tx:c*cell,ty:r*cell,vy:0,scale:1,flash:0,falling:false,landed:true}; }
  function newBoard(){
    grid=[]; for(let c=0;c<COLS;c++){grid[c]=[];for(let r=0;r<ROWS;r++)grid[c][r]=newBlock(c,r,Math.floor(Math.random()*PALETTE.length));}
    dying=[];particles=[];rings=[];popups=[];bgFlashes=[];
    score=0;phase="idle";shake=0;rot=0;zoom=1;bloom=0;flashOverlay=0;moves=0;level=0;heat=0;
    combo=0;comboTimer=0;celebrating=false;feverActive=false;clearoutEnd=0;pendingLeft=0;timeScale=1;slowmoUntil=0;simNow=0;hitstopReal=0;spaceAmt=0;cosmicAmt=0;warp=0;meteors=[];skyAmt=0;shells=[];skyNight=false;volleyLeft=0;
    scoreEl.textContent="0"; overlay.classList.remove("show"); ovCheer.textContent=""; updateFeverUI();
  }

  // ---- audio ----
  let actx=null;
  function audio(){ if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}} return actx; }
  const PENTA=[0,2,4,7,9];
  const noteFreq=s=>{const o=Math.floor(s/PENTA.length);return 261.63*Math.pow(2,o+PENTA[s%PENTA.length]/12);};
  function tone(f,at,dur,type,gain){ const a=audio();if(!a||!soundOn)return; const o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.setValueAtTime(f,at);g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(gain,at+.008);
    g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g).connect(a.destination);o.start(at);o.stop(at+dur); }
  function blip(f,dur=0.13,type="triangle",gain=0.1){ const a=audio();if(a)tone(f,a.currentTime,dur,type,gain); }
  function boom(size){ const a=audio();if(!a||!soundOn)return;const t0=a.currentTime;
    const o=a.createOscillator(),g=a.createGain();o.type="sine";const f=80+size*3.5;
    o.frequency.setValueAtTime(f,t0);o.frequency.exponentialRampToValueAtTime(f*.4,t0+.3);
    g.gain.setValueAtTime(Math.min(.4,(.06+size*.01)*(0.5+heat*0.5)),t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.34);
    o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+.36);
    if(heat>.4){const o2=a.createOscillator(),g2=a.createGain();o2.type="sine";o2.frequency.setValueAtTime(f*.5,t0);
      g2.gain.setValueAtTime(.16*Math.min(1,heat),t0);g2.gain.exponentialRampToValueAtTime(.0001,t0+.4);o2.connect(g2).connect(a.destination);o2.start(t0);o2.stop(t0+.42);} }
  function clack(){ const a=audio();if(!a||!soundOn)return;const t0=a.currentTime;
    const o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.setValueAtTime(rnd(150,240),t0);
    g.gain.setValueAtTime(.04,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.05);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+.06); }
  function rumble(count){ const a=audio();if(!a||!soundOn)return;const t0=a.currentTime;
    const o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.setValueAtTime(rnd(52,78),t0);o.frequency.exponentialRampToValueAtTime(38,t0+.26);
    g.gain.setValueAtTime(Math.min(.3,.05+count*.02),t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.3);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+.32); }
  function feverSound(L){ const a=audio();if(!a||!soundOn)return; const base=523.25*(1+Math.min(1.4,(L-1)*0.14));
    const notes=[0,4,7,12,16,19].slice(0,Math.min(6,3+L));
    notes.forEach((s,i)=>tone(base*Math.pow(2,s/12),a.currentTime+i*.05,.3,"triangle",.14));
    tone(base*4,a.currentTime+.05,.5,"sine",.05);
    const t0=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.setValueAtTime(70+L*8,t0);o.frequency.exponentialRampToValueAtTime(40,t0+.3);

    if(i%2===0) mKick(time,0.12);

    if(st>=3 && i%8===0) ch.tri.forEach(nt=>mNote(mf(nt),time,1.05,"sine",0.045));                                                    // パッド（MIRACLE）
    if(st>=4) mNote(mf(ch.tri[i%3]+12),time,0.13,"triangle",0.06);                                                                    // アルペジオ（ULTRA）
    if(st>=5 && (i===0||i===3||i===6||i===10||i===12)) mNote(mf(ch.tri[i%3]+12),time,0.2,"square",0.05);                             // リード（GALAXY）

    const gap=cell*0.06, size=(cell-gap*2)*b.scale, ox=b.x+(cell-size)/2, oy=b.y+(cell-size)/2;
    const gloss=clamp(heat*0.9,0,1), rad=size*(0.16+gloss*0.08);
    if(gloss>0.02){ const g=ctx.createLinearGradient(0,oy,0,oy+size);
      g.addColorStop(0,mix(p.base,p.top,gloss)); g.addColorStop(0.55,p.base); g.addColorStop(1,mix(p.base,p.dark,gloss)); ctx.fillStyle=g; }
    else ctx.fillStyle=p.base;
    roundRect(ox,oy,size,size,rad); ctx.fill();
    if(gloss>0.02){ ctx.globalAlpha=0.32*gloss; ctx.fillStyle="#fff"; roundRect(ox+size*0.16,oy+size*0.1,size*0.68,size*0.16,size*0.1); ctx.fill(); ctx.globalAlpha=1; }
    if(b.flash>0){ ctx.globalAlpha=Math.min(1,b.flash); ctx.fillStyle="#fff"; roundRect(ox,oy,size,size,rad); ctx.fill(); ctx.globalAlpha=1; }
  }
  function drawFever(){
    if(!feverActive) return;
    const speed=reduce?0:0.32+level*0.2, len=Math.max(W,H)*1.2, half=cell*(0.7+level*0.05), a=Math.min(0.22,0.1+level*0.02);
    const emitters = level<4 ? 1 : Math.min(4, level-2);
    const perEmit = level<4 ? Math.min(16,4+level*2) : Math.max(3, Math.round((4+level*2)/emitters));
    ctx.globalCompositeOperation="lighter";
    for(let e=0;e<emitters;e++){
      let cx=W/2, cy=H*0.5;
      if(emitters>1 && !reduce){ const oA=t*0.5+e*(Math.PI*2/emitters); cx=W/2+Math.cos(oA)*W*0.27; cy=H*0.5+Math.sin(oA*1.1)*H*0.22; }
      const dir=(e%2)?-1:1;
      for(let i=0;i<perEmit;i++){ const ang=t*speed*dir+i*(Math.PI*2/perEmit)+e*0.7;
        ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang);
        const col=SPOT_COLORS[(i+e)%SPOT_COLORS.length], grd=ctx.createLinearGradient(0,0,len,0);
        grd.addColorStop(0,hexA(col,0)); grd.addColorStop(0.05,hexA(col,a)); grd.addColorStop(1,hexA(col,0));
        ctx.fillStyle=grd; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(len,-half); ctx.lineTo(len,half); ctx.closePath(); ctx.fill();
        ctx.restore(); }
    }
    ctx.globalCompositeOperation="source-over";
  }

  function makeStars(){ stars=[]; const N=Math.round((W*H)/1800);
    for(let i=0;i<N;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:rnd(0.5,1.9),b:rnd(0.3,1),tw:rnd(1.5,4),ph:rnd(0,6.28),vy:rnd(3,11)}); }
  function drawPlanet(cx,cy,rad,base,alpha){
    const g=ctx.createRadialGradient(cx-rad*0.35,cy-rad*0.35,rad*0.1,cx,cy,rad);
    g.addColorStop(0,mix(base,"#ffffff",0.55)); g.addColorStop(0.5,base); g.addColorStop(1,mix(base,"#000000",0.72));
    ctx.globalAlpha=alpha; ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=alpha*0.28; ctx.drawImage(glowRef(base),cx-rad*1.9,cy-rad*1.9,rad*3.8,rad*3.8);
    ctx.globalCompositeOperation="source-over"; ctx.globalAlpha=1;
  }
  function makeClouds(){ clouds=[]; for(let i=0;i<4;i++) clouds.push({x:rnd(0,W),y:rnd(H*0.08,H*0.4),s:rnd(cell*1.6,cell*3),v:rnd(4,12)}); }
  function drawCloud(cx,cy,s){ ctx.beginPath(); ctx.arc(cx,cy,s*0.5,0,7); ctx.arc(cx+s*0.5,cy+s*0.1,s*0.4,0,7); ctx.arc(cx-s*0.52,cy+s*0.12,s*0.42,0,7); ctx.arc(cx+s*0.15,cy-s*0.2,s*0.4,0,7); ctx.arc(cx-s*0.2,cy-s*0.12,s*0.38,0,7); ctx.fill(); }
  function drawSky(alpha){
    if(skyNight){
      const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#0a1330"); g.addColorStop(0.55,"#132048"); g.addColorStop(1,"#26325a");
      ctx.globalAlpha=alpha; ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=alpha*0.5; const ms=Math.max(W,H)*0.35; ctx.drawImage(glowWhite,W*0.76-ms/2,H*0.16-ms/2,ms,ms);
      ctx.globalCompositeOperation="source-over"; ctx.globalAlpha=alpha; ctx.fillStyle="#fdf6e3"; ctx.beginPath(); ctx.arc(W*0.76,H*0.16,cell*0.85,0,7); ctx.fill();
      if(!stars) makeStars(); ctx.fillStyle="#ffffff";
      for(const s of stars){ if(s.y>H*0.82) continue; const tw=0.5+0.5*Math.sin(t*s.tw+s.ph); ctx.globalAlpha=alpha*s.b*tw; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill(); }
      const gy=H*0.9, gg=ctx.createLinearGradient(0,gy,0,H); gg.addColorStop(0,"#1c3b2a"); gg.addColorStop(1,"#122a1e");
      ctx.globalAlpha=alpha; ctx.fillStyle=gg; ctx.fillRect(0,gy,W,H-gy);
    } else {
      const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#3f9be0"); g.addColorStop(0.55,"#8ec8f1"); g.addColorStop(1,"#dcf0fb");
      ctx.globalAlpha=alpha; ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=alpha*0.45; const ss=Math.max(W,H)*0.55; ctx.drawImage(glowWhite,W*0.5-ss/2,-ss*0.35,ss,ss);
      ctx.globalCompositeOperation="source-over";
      const gy=H*0.9, gg=ctx.createLinearGradient(0,gy,0,H); gg.addColorStop(0,"#84cf6d"); gg.addColorStop(1,"#57a24b");
      ctx.globalAlpha=alpha; ctx.fillStyle=gg; ctx.fillRect(0,gy,W,H-gy);
      if(!clouds) makeClouds(); ctx.fillStyle="#ffffff";
      for(const c of clouds){ const cx=((c.x+t*c.v)%(W+300))-150; ctx.globalAlpha=alpha*0.9; drawCloud(cx,c.y,c.s); }
    }
    ctx.globalCompositeOperation="lighter";
    for(const sh of shells){ ctx.globalAlpha=alpha; ctx.drawImage(glowSpark[sh.color],sh.x-cell*0.4,sh.y-cell*0.4,cell*0.8,cell*0.8); }
    ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
  }
  function drawSpace(alpha){
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#0a0622"); g.addColorStop(0.5,"#0c0430"); g.addColorStop(1,"#040110");
    ctx.globalAlpha=alpha; ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
    if(!stars) makeStars();
    ctx.save();
    if(cosmicAmt>0.01 && !reduce){ ctx.translate(W/2,H/2); ctx.rotate(t*0.03*cosmicAmt); ctx.translate(-W/2,-H/2); }
    ctx.globalCompositeOperation="lighter";
    const gs=Math.max(W,H)*1.15;
    for(let i=0;i<3;i++){ const nx=W*(0.3+0.42*Math.sin(t*0.05+i*2)), ny=H*(0.32+0.26*Math.cos(t*0.04+i*1.5));
      if(cosmicAmt<0.99){ ctx.globalAlpha=alpha*NEB_G[i][1]*(1-cosmicAmt); ctx.drawImage(glowRef(NEB_G[i][0]),nx-gs/2,ny-gs/2,gs,gs); }
      if(cosmicAmt>0.01){ ctx.globalAlpha=alpha*NEB_C[i][1]*cosmicAmt; ctx.drawImage(glowRef(NEB_C[i][0]),nx-gs/2,ny-gs/2,gs,gs); } }
    for(const s of stars){ const tw=0.55+0.45*Math.sin(t*s.tw+s.ph), sy=((s.y+t*s.vy)%H+H)%H, aa=alpha*s.b*tw;
      if(warp>0.02){ const dx=s.x-W/2, dy=sy-H/2, d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d, st=warp*(40+d*0.6);
        const grd=ctx.createLinearGradient(s.x,sy,s.x+ux*st,sy+uy*st); grd.addColorStop(0,hexA("#ffffff",aa)); grd.addColorStop(1,hexA("#9fd0ff",0));
        ctx.strokeStyle=grd; ctx.lineWidth=s.r*1.3; ctx.beginPath(); ctx.moveTo(s.x,sy); ctx.lineTo(s.x+ux*st,sy+uy*st); ctx.stroke(); }
      else { ctx.globalAlpha=aa; ctx.fillStyle="#ffffff"; ctx.beginPath(); ctx.arc(s.x,sy,s.r,0,Math.PI*2); ctx.fill(); } }
    ctx.restore();
    if(cosmicAmt>0.01){ ctx.globalCompositeOperation="lighter"; const cs=Math.max(W,H)*0.6; ctx.globalAlpha=alpha*0.22*cosmicAmt; ctx.drawImage(glowRef("#ffe9c4"),W/2-cs/2,H*0.42-cs/2,cs,cs); }
    ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
    const px=W*(0.83+0.03*Math.sin(t*0.03)), py=H*(0.15+0.02*Math.cos(t*0.025));
    drawPlanet(px,py,cell*1.5, cosmicAmt>0.5?"#ffb347":"#6a7bd0", alpha*0.9);
    ctx.globalCompositeOperation="lighter";
    for(const mm of meteors){ const d=Math.hypot(mm.vx,mm.vy)||1, ux=mm.vx/d, uy=mm.vy/d, tx=mm.x-ux*mm.len, ty=mm.y-uy*mm.len;
      const grd=ctx.createLinearGradient(mm.x,mm.y,tx,ty); grd.addColorStop(0,hexA("#ffffff",0.9*alpha*mm.life)); grd.addColorStop(1,hexA("#7fd0ff",0));
      ctx.strokeStyle=grd; ctx.lineWidth=Math.max(1,cell*0.08); ctx.beginPath(); ctx.moveTo(mm.x,mm.y); ctx.lineTo(tx,ty); ctx.stroke();
      ctx.globalAlpha=alpha*mm.life; ctx.drawImage(glowWhite,mm.x-cell*0.32,mm.y-cell*0.32,cell*0.64,cell*0.64); ctx.globalAlpha=1; }
    ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    const hh=Math.min(1,heat);
    const bg=ctx.createRadialGradient(W/2,H*0.35,0,W/2,H*0.35,Math.max(W,H)*0.75);
    bg.addColorStop(0,`rgba(${28+hh*72},${12+hh*12},${44+hh*36},1)`); bg.addColorStop(1,"#0a0514");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    if(spaceAmt>0.01) drawSpace(spaceAmt);
    if(skyAmt>0.01) drawSky(skyAmt);
    ctx.globalCompositeOperation="lighter";
    for(const f of bgFlashes){ ctx.globalAlpha=f.a; const gs=f.r*2; ctx.drawImage(glowRef(f.color),f.x-gs/2,f.y-gs/2,gs,gs); }
    ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
    drawFever();

    let sx=0,sy=0; if(shake>0){sx=rnd(-shake,shake);sy=rnd(-shake,shake);}
    ctx.save(); ctx.translate(W/2+sx,H/2+sy); ctx.scale(zoom,zoom); ctx.rotate(rot); ctx.translate(-W/2,-H/2);

    const amb=heat*0.34;
    if(amb>0){ for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){const b=grid[c][r];if(b)drawBlock(b,amb);}
      for(const b of dying)drawBlock(b,amb*1.4); }
    for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){const b=grid[c][r];if(b)drawBlock(b,0);}
    for(const b of dying)drawBlock(b,0);

    ctx.globalCompositeOperation="lighter";
    for(const pt of particles){ ctx.globalAlpha=clamp(pt.life,0,1); const s=pt.size*(0.4+pt.life*0.6); ctx.drawImage(pt.sprite,pt.x-s/2,pt.y-s/2,s,s); }
    for(const rg of rings){ ctx.globalAlpha=clamp(rg.life,0,1)*0.9; ctx.strokeStyle=rg.color; ctx.lineWidth=rg.width*(0.3+rg.life*0.7);
      ctx.beginPath(); ctx.arc(rg.x,rg.y,rg.r,0,Math.PI*2); ctx.stroke(); }
    ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";

    for(const pu of popups){ const a=clamp(pu.life*1.5,0,1), rise=(1-pu.life)*44, sz=pu.size||1, dx=(pu.vx||0)*(1-pu.life); ctx.textAlign="center";ctx.textBaseline="middle";
      const lines=(""+pu.text).split("\n"), fs=Math.round(cell*0.75*sz), lh=fs*1.02, y0=pu.y-rise-(lines.length-1)*lh/2;
      ctx.globalAlpha=a; ctx.font=`800 ${fs}px system-ui,sans-serif`; ctx.fillStyle=pu.color||"#fff";
      ctx.shadowColor=pu.glow||"rgba(255,120,190,.9)"; ctx.shadowBlur=18;
      for(let li=0;li<lines.length;li++) ctx.fillText(lines[li],pu.x+dx,y0+li*lh); ctx.shadowBlur=0;
      if(pu.sub){ ctx.globalAlpha=a*0.85; ctx.font=`800 ${Math.round(cell*0.32)}px system-ui,sans-serif`; ctx.fillStyle="#ffd7a0"; ctx.fillText(pu.sub,pu.x+dx,y0+(lines.length-1)*lh+cell*0.5); } ctx.globalAlpha=1; }
    ctx.restore();

    if(bloom>0.001){ ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=Math.min(0.5,bloom*0.16); ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over"; }
    if(flashOverlay>0.001){ ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=flashOverlay; ctx.fillStyle=flashColor; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over"; }
    if(level>=1 && !celebrating){ const pv=(0.5+0.5*Math.sin(t*3))*Math.min(1,heat)*0.06; ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=pv; ctx.fillStyle="#ff5da8"; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over"; }
    if(feverActive&&!reduce){ const freq=10+level*3; if(Math.sin(t*freq)>0.5){ const col=SPOT_COLORS[Math.floor(t*4)%SPOT_COLORS.length]; ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=Math.min(0.22,0.05+level*0.028); ctx.fillStyle=col; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over"; } }
  }

  // ---- update ----
  let last=performance.now();
  function update(ts){
    let realDt=(ts-last)/1000; last=ts; if(realDt>0.05)realDt=0.05; t+=realDt;
    const tgt = ts<slowmoUntil ? 0.32 : 1;
    timeScale += (tgt-timeScale)*Math.min(1,realDt*(tgt<timeScale?18:5));
    const frozen = ts<hitstopReal;
    const simDt = frozen?0: realDt*timeScale;
    simNow += simDt*1000;
    feverActive = level>=1 && !celebrating;
    spaceAmt += (((level>=6&&!celebrating)?1:0)-spaceAmt)*Math.min(1,realDt*1.2);
    skyAmt += ((celebrating?1:0)-skyAmt)*Math.min(1,realDt*1.5);
    cosmicAmt += ((level>=7?1:0)-cosmicAmt)*Math.min(1,realDt*1.0);
    if(warp>0.001){ warp*=Math.pow(0.02,realDt); if(warp<0.01)warp=0; }
    if(spaceAmt>0.4 && !reduce){ if(Math.random()<0.012) meteors.push({x:rnd(-20,W*0.5),y:rnd(-20,H*0.2),vx:rnd(170,300),vy:rnd(150,280),life:1,len:rnd(cell*2.2,cell*4.2)}); }
    for(let i=meteors.length-1;i>=0;i--){ const mm=meteors[i]; mm.x+=mm.vx*realDt; mm.y+=mm.vy*realDt; mm.life-=realDt*0.4; if(mm.life<=0||mm.y>H+60||mm.x>W+60) meteors.splice(i,1); }

    if(comboTimer>0){ comboTimer-=realDt; if(comboTimer<=0)combo=0; }
    shake*=Math.pow(0.0015,realDt); if(shake<0.2)shake=0;
    rot = shake>6? rnd(-1,1)*shake*0.0011:0;
    zoom += (1-zoom)*Math.min(1,realDt*9);
    bloom*=Math.pow(0.03,realDt); if(bloom<0.003)bloom=0;
    flashOverlay*=Math.pow(0.0009,realDt); if(flashOverlay<0.003)flashOverlay=0;

    const pulse=frozen?(0.55+0.45*Math.sin(ts*0.05)):0;
    for(const b of dying) if(b.flash!==undefined) b.flash=frozen?pulse:Math.max(0,b.flash-simDt*3);

    if(!frozen){
      for(let i=dying.length-1;i>=0;i--){ const b=dying[i];
        if(b.dieAt!==undefined&&simNow>=b.dieAt){ b.scale+=simDt*7; b.flash=Math.min(1,b.flash+simDt*4);
          if(b.scale>=1.4||b.deadPending){killBlock(b);dying.splice(i,1);}else b.deadPending=b.scale>=1.25; } }
      if(phase==="clearing"&&dying.length===0&&simNow>=waveEndAt){ collapse(); updateFeverUI(); }
      if(phase==="clearout"&&dying.length===0&&simNow>=clearoutEnd){ finishCelebrate(); }
    }

    let settling=false, landCount=0, dustBudget=10; const G=3200, bv=420;
    for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){ const b=grid[c][r]; if(!b)continue;
      if(Math.abs(b.x-b.tx)>0.5){ b.x+=(b.tx-b.x)*Math.min(1,simDt*16); settling=true; } else b.x=b.tx;
      if(b.y<b.ty-0.5||Math.abs(b.vy)>1){ b.vy+=G*simDt; b.y+=b.vy*simDt;
        if(b.y>=b.ty){ const impact=b.vy; b.y=b.ty;
          if(!b.landed&&b.falling){ b.landed=true; landCount++; if(dustBudget>0&&impact>bv&&heat>0.05){dustBudget--;landDust(b.x+cell/2,b.ty+cell*0.92,impact);} }
          if(impact>bv){ b.vy=-impact*0.22; settling=true; } else b.vy=0;
        } else settling=true;
      } else { b.y=b.ty; b.vy=0; }
      if(b.scale>1)b.scale=Math.max(1,b.scale-simDt*4);
    }
    if(landCount>0){ shake=Math.max(shake, Math.min(landCount,18)*0.5*(0.12+Math.min(1,heat)*0.9)); if(landCount>=5&&heat>0.05)rumble(landCount); }
    if(phase==="collapsing"&&!settling){ checkEnd(); }

    if(celebrating){
      if(volleyLeft>0){ volleyTimer-=realDt; if(volleyTimer<=0&&shells.length<10){ volleyTimer=0.1; spawnShell(); volleyLeft--; } }
      else { fwTimer-=realDt; if(fwTimer<=0&&particles.length<380&&shells.length<8){ fwTimer=rnd(0.35,0.7);
        if(Math.random()<0.22) volleyLeft=Math.round(rnd(4,7)); else spawnShell(); } }
      for(let i=shells.length-1;i>=0;i--){ const sh=shells[i]; sh.y-=sh.sp*realDt; sh.tt-=realDt;
        if(sh.tt<=0){ sh.tt=0.03; particles.push({x:sh.x+rnd(-2,2),y:sh.y,vx:rnd(-10,10),vy:rnd(20,60),life:0.6,decay:2.2,size:rnd(cell*0.2,cell*0.4),sprite:glowSpark[sh.color],grav:0.2}); }
        if(sh.y<=sh.ty){ firework(sh.x,sh.y,sh.color,sh.type); if(soundOn)fwPop(); shells.splice(i,1); } }
      cheerTimer-=realDt; if(cheerTimer<=0){ cheerTimer=1.3; cheerIdx=(cheerIdx+1)%CHEERS.length; setCheer(); } }

    if(heat>0.6&&!reduce&&!celebrating&&Math.random()<Math.min(1,heat)*0.4){ particles.push({x:rnd(0,W),y:H+10,vx:rnd(-20,20),vy:rnd(-70,-140),life:1,decay:rnd(0.5,0.9),size:rnd(cell*0.3,cell*0.7),sprite:glowSpark[Math.floor(Math.random()*PALETTE.length)],grav:0.2}); }

    const mdt = frozen?0:realDt*timeScale;
    for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.vy+=1500*mdt*(p.grav)*(p.vy>0?1:0.4); p.x+=p.vx*mdt; p.y+=p.vy*mdt; p.vx*=Math.pow(0.4,mdt); p.life-=mdt*p.decay; if(p.life<=0)particles.splice(i,1); }
    for(let i=rings.length-1;i>=0;i--){ const rg=rings[i]; rg.r+=(rg.maxR-rg.r)*Math.min(1,mdt*6); rg.life-=mdt*rg.decay; if(rg.life<=0)rings.splice(i,1); }
    for(let i=bgFlashes.length-1;i>=0;i--){ bgFlashes[i].a*=Math.pow(0.02,realDt); if(bgFlashes[i].a<0.01)bgFlashes.splice(i,1); }
    for(let i=popups.length-1;i>=0;i--){ popups[i].life-=realDt*0.9; if(popups[i].life<=0)popups.splice(i,1); }

    if((ts|0)%3===0) updateFeverUI();
    render(); requestAnimationFrame(update);
  }

  // ---- input ----
  function pt(e){ const rc=canvas.getBoundingClientRect(); const px=(e.touches?e.touches[0].clientX:e.clientX)-rc.left, py=(e.touches?e.touches[0].clientY:e.clientY)-rc.top; return {c:Math.floor(px/cell),r:Math.floor(py/cell)}; }
  canvas.addEventListener("click",e=>{ const {c,r}=pt(e); if(c>=0&&c<COLS&&r>=0&&r<ROWS)tapCell(c,r); });
  const sb=document.getElementById("soundBtn");
  sb.addEventListener("click",()=>{ soundOn=!soundOn; sb.setAttribute("aria-pressed",String(soundOn)); sb.textContent=soundOn?"音 ON":"音 OFF";
    if(soundOn){audio();if(actx&&actx.state==="suspended")actx.resume();startMusic();} if(musicGain)musicGain.gain.value=soundOn?0.5:0; });
  window.addEventListener("resize",()=>{ resize(); stars=null; clouds=null; if(grid)for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){const b=grid[c][r];if(b){b.tx=c*cell;b.ty=r*cell;b.x=b.tx;b.y=b.ty;}} });

  resize(); newBoard(); requestAnimationFrame(update);
})();
</script>
</body>
