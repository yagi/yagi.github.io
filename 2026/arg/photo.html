<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VISUAL RECOVERY</title>
  <link rel="stylesheet" href="styles.css">
  <script src="game.js"></script>
</head>
<body class="terminal-page">
  <main class="terminal">
    <h1>VISUAL RECOVERY</h1>
    <hr>
    <div class="status">Recovered: 83%</div>
    <p>Visual record contains one missing identity.</p>

    <div style="border:1px solid #414647;padding:22px;margin:24px 0;max-width:600px">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center">
        <button onclick="wrong()">人物A</button>
        <button onclick="wrong()">人物B</button>
        <button id="yuBtn">欠落領域</button>
        <button onclick="wrong()">人物C</button>
      </div>
      <p class="muted small">MVPでは画像を使わず構造だけ実装。本番では集合写真＋不自然な背景補完に置換。</p>
    </div>

    <div id="msg" class="error"></div>
  </main>
  <script>
    function wrong(){ document.getElementById('msg').textContent = 'No match.'; }
    document.getElementById('yuBtn').onclick = () => {
      saveState({ recovered: 91 });
      location.href = 'diary.html';
    };
  </script>
</body>
</html>
