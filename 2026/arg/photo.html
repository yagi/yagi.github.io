<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLOCK CHECK</title>
  <link rel="stylesheet" href="styles.css">
  <script src="game.js"></script>
</head>
<body class="terminal-page">
  <main class="terminal">
    <h1>BLOCK CHECK</h1>
    <hr>
    <div class="status">Index coverage: 83%</div>
    <p>照合が完了しました。関連ファイルに欠損ブロックが1件あります。</p>

    <div class="block-map" aria-label="4つのデータブロックのうち1つが欠損">
      <span>01<br>OK</span><span>02<br>OK</span><span class="missing">03<br>欠損</span><span>04<br>OK</span>
    </div>
    <p class="muted small">Cross-reference match: 97.4% / block: 03</p>
    <p>照合済みの索引を使って欠損ブロックを補完します。続けると関連ファイルが閲覧可能になります。</p>
    <button id="restoreVisual">欠損ブロックを補完</button>
    <div id="msg" class="error"></div>
  </main>
  <script>
    document.getElementById('restoreVisual').onclick = () => {
      saveState({ recovered: 91, visualRestored: true });
      location.href = 'reveal.html';
    };
  </script>
</body>
</html>
