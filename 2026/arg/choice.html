<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RECOVERY DECISION</title>
  <link rel="stylesheet" href="styles.css">
  <script src="game.js"></script>
</head>
<body class="terminal-page">
  <main class="terminal">
    <h1>RECOVERY DECISION</h1>
    <hr>
    <div class="status">Recovered: 91%</div>
    <p>残り9%。処理を選択してください。</p><p><a href="diary.html">本人の記録を読み直す</a></p>

    <div class="choice-wrap">
      <div class="choice">
        <h3>RESTORE</h3>
        <p>残り9%を復元し、水原ユウの名前と関連記録を検索可能にします。</p>
        <button onclick="choose('restore')">復元する</button>
      </div>
      <div class="choice">
        <h3>PURGE</h3>
        <p>このアーカイブ内の人物記録と、紐づく37件の参照を削除します。本人がいたことを示す関連記録も失われます。</p>
        <button onclick="choose('delete')">削除する</button>
      </div>
    </div>
  </main>
  <script>
    function choose(kind) {
      saveState({ ending: kind, endedAt: localTimestamp() });
      location.href = kind === 'restore' ? 'ending-restore.html' : 'ending-delete.html';
    }
  </script>
</body>
</html>
